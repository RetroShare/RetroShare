name: Mirror to GitLab

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    # This mirrors to the official project's GitLab remote and needs a
    # secret that only exists in RetroShare/RetroShare - skip it entirely
    # on forks instead of failing (or, worse, trying to push a fork's
    # history over the real project's GitLab mirror).
    if: github.repository == 'RetroShare/RetroShare'

    steps:
      - name: Install GitLab deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.RETROSHARE_GITLAB_MIRROR_SSH_KEY }}

      - name: Trust GitLab host key
        run: |
          ssh-keyscan gitlab.com >> ~/.ssh/known_hosts

      - name: Mirror repository to GitLab
        run: |
          git clone --bare "https://github.com/${GITHUB_REPOSITORY}.git" repo.git
          cd repo.git
          git remote set-url --push origin git@gitlab.com:RetroShare/RetroShare.git
          git push --prune origin 'refs/heads/*:refs/heads/*' 'refs/tags/*:refs/tags/*'
