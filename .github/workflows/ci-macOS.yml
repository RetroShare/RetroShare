name: macOS Build

on:
  push:
    paths-ignore:
    - '**/*.md'
  pull_request:
    paths-ignore:
    - '**/*.md'

concurrency:  
  group: ${{ github.workflow}}-${{ github.head_ref }}  
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # macos-15: Homebrew dropped macOS 14 (Sonoma) as a supported version, so
    # it no longer builds bottles for it. On macos-14 `brew install qt` then
    # tries to build qtwebengine (Chromium) from source, which first demands a
    # full Xcode >= 15.3 and, even with one, fails after an hour on the runner.
    runs-on: macos-15
    permissions:
      actions: write
    defaults:
      run:
        shell: bash

    steps:
      # No explicit Xcode pin: the previously pinned Xcode 15.0.1 does not
      # exist on macos-15 and was only needed for the macosx14.0 SDK (see the
      # CI-Build step). The runner default is used, like in the CMake macOS
      # workflows.
      - name: Show current version of Xcode
        run: xcodebuild -version

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Show OpenSSL version
        run: pkg-config --cflags libcrypto

      - name: Install Packages
        run: brew install openssl
          miniupnpc
          rapidjson
          sqlcipher
          bzip2
          zlib
          botan@2
          libxslt
          libxml2
          qt

      - name: Checkout submodules
        run: |
          env
          git submodule update --init --remote libbitdht/ libretroshare/ retroshare-webui/
          git submodule update --init supportlibs/librnp supportlibs/rapidjson supportlibs/restbed openpgpsdk/

      # rs_macos14.0 keeps the 14.0 deployment target but hard-codes
      # QMAKE_MAC_SDK=macosx14.0, an SDK only shipped by Xcode 15.0.x. The
      # `-after` assignment (applied after retroshare.pri) replaces it with the
      # generic "macosx" SDK name, which resolves to whatever SDK the selected
      # Xcode provides, so the job no longer breaks on every Xcode/SDK bump.
      - name: CI-Build
        run: |
          qmake6 . -r "CONFIG+=rs_macos14.0" "CONFIG+=release" "CONFIG+=rs_autologin" "CONFIG+=no_rs_sam3" "CONFIG+=no_rs_sam3_libsam3" "CONFIG+=rs_no_rnplib" \
          INCLUDEPATH+="/opt/homebrew/opt/openssl@3/include" \
          INCLUDEPATH+="/opt/homebrew/opt/rapidjson/include" \
          INCLUDEPATH+="/opt/homebrew/opt/sqlcipher/include" \
          INCLUDEPATH+="/opt/homebrew/opt/miniupnpc/include" \
          INCLUDEPATH+="/opt/homebrew/opt/libxslt/include" \
          INCLUDEPATH+="/opt/homebrew/opt/libxml2/include" \
          QMAKE_LIBDIR+="/opt/homebrew/opt/openssl@3/lib" \
          QMAKE_LIBDIR+="/opt/homebrew/opt/rapidjson/lib" \
          QMAKE_LIBDIR+="/opt/homebrew/opt/sqlcipher/lib" \
          QMAKE_LIBDIR+="/opt/homebrew/opt/miniupnpc/lib" \
          QMAKE_LIBDIR+="/opt/homebrew/opt/libxslt/lib" \
          QMAKE_LIBDIR+="/opt/homebrew/opt/libxml2/lib" \
          CONFIG+=no_retroshare_service \
          CONFIG+=no_retroshare_friendserver \
          -after QMAKE_MAC_SDK=macosx
          make
